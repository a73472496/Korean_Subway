<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理後台｜KSW-METRO</title>
  <style>
    :root { --ink:#20302f; --muted:#647270; --line:rgba(255,255,255,.78); --bg:#edf4f3; --brand:#287c73; --brand-hover:#1e685f; --danger:#a84a4a; --glass:rgba(255,255,255,.68); --glass-shadow:0 14px 34px rgba(36,79,73,.10); }
    * { box-sizing:border-box; } body { margin:0; font-family:system-ui,"Noto Sans TC",sans-serif; color:var(--ink); background-color:#edf4f3; background-image:linear-gradient(rgba(244,249,248,.74),rgba(237,244,243,.88)),url('assets/metro-glass-pattern.png'); background-position:center,center; background-size:cover,cover; background-repeat:no-repeat; background-attachment:fixed,fixed; }
    main { max-width:960px; margin:auto; padding:32px 16px 72px; } .bar,.card { background:linear-gradient(135deg,rgba(255,255,255,.82),var(--glass)); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:var(--glass-shadow); backdrop-filter:blur(16px) saturate(132%); -webkit-backdrop-filter:blur(16px) saturate(132%); }
    .bar { display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap; } h1,h2,p { margin-top:0; } .muted { color:var(--muted); }
    input,textarea,select,button { font:inherit; } input,textarea,select { width:100%; padding:10px; border:1px solid rgba(196,216,211,.9); border-radius:8px; margin:5px 0 12px; background:rgba(255,255,255,.78); } input:focus,textarea:focus,select:focus { border-color:var(--brand); outline:3px solid rgba(40,124,115,.18); }
    button { min-height:44px; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; background:var(--brand); color:white; font-weight:700; } button:hover { background:var(--brand-hover); } button.secondary { background:rgba(255,255,255,.72); color:var(--brand); border:1px solid rgba(176,208,201,.92); } button.secondary:hover { background:rgba(234,244,241,.92); } button.danger { background:#fff5f4; color:var(--danger); border:1px solid #ebc8c4; } button.danger:hover { background:#fee8e6; }
    .hidden { display:none; } .report-head,.actions { display:flex; gap:10px; justify-content:space-between; align-items:start; flex-wrap:wrap; } .meta { color:var(--muted); font-size:.9rem; }
    .message { color:var(--danger); min-height:1.5em; } .tabs { display:flex; gap:8px; flex-wrap:wrap; } a { color:var(--brand); font-weight:700; } :focus-visible { outline:3px solid var(--brand); outline-offset:3px; }
    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { .bar,.card { background:rgba(255,255,255,.92); } }
  </style>
</head>
<body>
  <main>
    <header class="bar">
      <div><h1>回報管理後台</h1><p class="muted">登入後可查看、更新或刪除使用者回報。</p></div>
      <a href="index.html">返回首頁</a>
    </header>

    <section id="login" class="card">
      <h2>管理員登入</h2>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>密碼<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登入</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="bar">
        <div class="tabs"><button class="secondary filter" data-status="all">全部</button><button class="secondary filter" data-status="new">新增</button><button class="secondary filter" data-status="doing">處理中</button><button class="secondary filter" data-status="done">已完成</button></div>
        <div><button id="refresh" class="secondary">重新整理</button> <button id="logout" class="danger">登出</button></div>
      </div>
      <p id="dashboardMessage" class="message"></p>
      <div id="reports"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const $ = selector => document.querySelector(selector);
    let client, reports = [], selectedStatus = 'all';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const message = (id, text = '') => $(id).textContent = text;
    const isAdmin = async () => { const { data, error } = await client.rpc('is_admin'); return !error && data === true; };
    async function loadReports() {
      message('#dashboardMessage', '');
      const { data, error } = await client.from('reports').select('*').order('created_at', { ascending:false });
      if (error) { message('#dashboardMessage', '目前無法載入回報，請重新整理後再試。'); return; }
      reports = data; render();
    }
    function render() {
      const shown = reports.filter(r => selectedStatus === 'all' || r.status === selectedStatus);
      $('#reports').innerHTML = shown.length ? shown.map(r => `<article class="card" data-id="${r.id}"><div class="report-head"><div><h2>${esc(r.type)}</h2><p class="meta">${esc(r.station || '未填站名')} · ${new Date(r.created_at).toLocaleString('zh-TW')}</p></div><select class="status"><option value="new">新增</option><option value="doing">處理中</option><option value="done">已完成</option></select></div><p>${esc(r.body)}</p><p class="meta">聯絡方式：${esc(r.contact || '未提供')}</p><textarea class="note" placeholder="管理備註">${esc(r.note)}</textarea><div class="actions"><button class="save">儲存</button><button class="danger remove">刪除</button></div></article>`).join('') : '<section class="card muted">目前沒有回報。</section>';
      shown.forEach(r => { const card = document.querySelector(`[data-id="${r.id}"]`); card.querySelector('.status').value = r.status; card.querySelector('.save').onclick = () => save(r.id, card); card.querySelector('.remove').onclick = () => remove(r.id); });
    }
    async function save(id, card) {
      const { error } = await client.from('reports').update({ status:card.querySelector('.status').value, note:card.querySelector('.note').value, updated_at:new Date().toISOString() }).eq('id', id);
      if (error) return message('#dashboardMessage', '儲存沒有成功，請再試一次。'); await loadReports();
    }
    async function remove(id) { if (!confirm('要刪除這則回報嗎？')) return; const { error } = await client.from('reports').delete().eq('id', id); if (error) return message('#dashboardMessage', '刪除沒有成功，請再試一次。'); await loadReports(); }
    $('#loginForm').onsubmit = async event => { event.preventDefault(); message('#loginMessage', ''); const { error } = await client.auth.signInWithPassword({ email:$('#email').value, password:$('#password').value }); if (error) return message('#loginMessage', '登入沒有成功，請確認 Email、密碼與網路連線後再試。'); await showDashboard(); };
    $('.filter').onclick = () => {}; document.querySelectorAll('.filter').forEach(btn => btn.onclick = () => { selectedStatus = btn.dataset.status; render(); });
    $('#refresh').onclick = loadReports; $('#logout').onclick = async () => { await client.auth.signOut(); $('#dashboard').classList.add('hidden'); $('#login').classList.remove('hidden'); };
    async function showDashboard() { if (!(await isAdmin())) { await client.auth.signOut(); return message('#loginMessage', '這個帳號沒有後台權限。'); } $('#login').classList.add('hidden'); $('#dashboard').classList.remove('hidden'); await loadReports(); }
    (async () => { try { client = await window.supabaseReady; const { data:{session} } = await client.auth.getSession(); if (session) await showDashboard(); } catch (error) { message('#loginMessage', '系統暫時無法啟動，請重新整理後再試。'); } })();
  </script>
</body>
</html>
